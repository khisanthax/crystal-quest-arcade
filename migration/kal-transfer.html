<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bring your Star Quest save to Science Adventure Arcade</title><style>body{background:#183249;color:#fff2d2;font:18px system-ui;max-width:580px;margin:35px auto;padding:25px;line-height:1.6}button,a{display:block;background:#b9ead6;color:#19394b;border:0;border-radius:14px;padding:14px 20px;margin:15px 0;font:700 18px system-ui;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}small{color:#b7d7d1}</style></head><body><h1>Bring your Star Quest adventure along!</h1><p>This reads only your Star Quest saved Star Quest progress in this browser. His original save stays here.</p><button id="transfer">TRANSFER STAR QUEST SAVE</button><button id="download">DOWNLOAD A BACKUP</button><p id="status" role="status"></p><a href="https://volcano-quest-island-adventure.khisanthax.chatgpt.site">RETURN TO SCIENCE ADVENTURE ARCADE</a><small>If this window has no saved progress, open it in the Safari or Home Screen location the explorer used before.</small><script>
const target='https://volcano-quest-island-adventure.khisanthax.chatgpt.site';
function read(){try{const p=JSON.parse(localStorage.getItem('star-quest-kal-v1'));return p?.version===1&&p.stats?p:null;}catch{return null;}}
document.getElementById('transfer').onclick=()=>{const progress=read();if(!progress){document.getElementById('status').textContent='No saved Star Quest progress was found in this browser window.';return;}if(!window.opener){document.getElementById('status').textContent='Download a backup, then use Parent save tools → Import a backup in the arcade.';return;}window.opener.postMessage({type:'science-arcade:legacy-save',player:'kal',progress},target);document.getElementById('status').textContent='Sent! Return to the arcade and confirm the import.';};
document.getElementById('download').onclick=()=>{const progress=read();if(!progress){document.getElementById('status').textContent='No saved progress was found here.';return;}const url=URL.createObjectURL(new Blob([JSON.stringify({format:'science-adventure-arcade-save-v1',world:'luminara',progress},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='science-arcade-luminara-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);document.getElementById('status').textContent='Backup ready. Import it with Parent save tools in the arcade.';};
window.addEventListener('message',e=>{if(e.origin===target&&e.source===window.opener&&e.data?.type==='science-arcade:received')document.getElementById('status').textContent='Received by the arcade. Please confirm there. This original save has not been changed.';});
</script></body></html>
