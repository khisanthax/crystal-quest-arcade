name: Arcade checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: arcade-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    # Keep browser/system dependencies on a reviewed LTS image.
    runs-on: ubuntu-24.04
    container:
      # Keep this version in sync with package-lock.json. Browsers and their
      # system libraries are already installed; CI never waits on apt mirrors.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify pinned browser image matches the project
        run: node -e "if(require('@playwright/test/package.json').version !== '1.64.1') throw new Error('Update the CI browser image with package-lock.json')"
      - run: npm run test:browser -- --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/2
      - if: matrix.shard == 1
        run: npx playwright test --config=playwright.game-master.config.js --project=${{ matrix.engine }}
      - if: matrix.shard == 1
        run: npx playwright test tests/reading-no-owner-key.spec.js --project=${{ matrix.engine }}
        env:
          PW_DISABLE_OWNER_KEY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  release-ready:
    runs-on: ubuntu-latest
    needs: [verify, browser]
    if: always()
    steps:
      - name: Require build and browser checks
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
