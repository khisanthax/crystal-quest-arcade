name: Arcade checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: arcade-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser and system dependencies
        timeout-minutes: 8
        env:
          PLAYWRIGHT_ENGINE: ${{ matrix.engine }}
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 210s npx playwright install --with-deps "$PLAYWRIGHT_ENGINE"; then
              exit 0
            fi
            echo "Playwright installation attempt $attempt failed."
          done
          exit 1
      - run: npm run test:browser -- --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/2
      - if: matrix.shard == 1
        run: npx playwright test --config=playwright.game-master.config.js --project=${{ matrix.engine }}
      - if: matrix.shard == 1
        run: npx playwright test tests/reading-no-owner-key.spec.js --project=${{ matrix.engine }}
        env:
          PW_DISABLE_OWNER_KEY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  release-ready:
    runs-on: ubuntu-latest
    needs: [verify, browser]
    if: always()
    steps:
      - name: Require build and browser checks
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
