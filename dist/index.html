<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#132139"><meta name="apple-mobile-web-app-capable" content="yes"><title>Crystal Quest Arcade</title><meta name="description" content="Three adventures: a crystal runner, original platform quests, and Reading Detective homework cases with private Explorer cloud saves."><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./runner/style.css"><link rel="stylesheet" href="./runner/mode-menu.css"><link rel="stylesheet" href="./reading/style.css"><link rel="stylesheet" href="./cloud/style.css"></head><body>
<canvas id="scene" tabindex="0" aria-label="Third-person crystal runner. Swipe left or right, up to jump, down to slide."></canvas>
<div id="hud" hidden><div class="hud-left"><button id="leave" aria-label="Return to player menu">⌂</button><span id="hearts">♥ ♥ ♥</span><span id="crystals">◆ 0</span></div><div class="mission"><strong id="stage-name"></strong><span id="checkpoint-progress"></span><div class="meter"><i id="gate-meter"></i></div></div><div class="hud-right"><button id="audio">♪ OFF</button><button id="pause">Ⅱ PAUSE</button></div><div id="obstacle-hint" role="status" hidden></div><div id="power-bar"><button data-select="shield">SHIELD</button><button data-select="dash">SMASH DASH</button><button data-select="blast">BLAST</button><span id="active-power"></span></div></div>
<div id="overlay"></div><div id="sync-status" role="status">Device only</div><div id="notice" role="status"></div><div id="save-warning" hidden>Saving is unavailable. Export a backup from Parent Settings before closing.</div>
<div id="controls" hidden><div class="control-left"><button data-action="left" aria-label="Move left">◀</button><button data-action="right" aria-label="Move right">▶</button></div><button class="power" data-action="power">✦<small>POWER</small></button><div class="control-right"><button data-action="slide">↓<small>SLIDE</small></button><button data-action="jump">↑<small>JUMP</small></button></div></div>
<div id="rotate"><div>↻</div><h1>Turn your iPad sideways</h1><p>Your adventure will wait for you.</p></div><script>if('serviceWorker' in navigator){const returning=!!navigator.serviceWorker.controller;let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(returning&&!refreshing){refreshing=true;location.reload();}});}</script><script type="module" src="./runner/app.js"></script></body></html>
